{% extends "base.html" %}
{% block title %}注册 · 招聘数据分析仪表盘{% endblock %}
{% block content %}
<div class="auth-box">
  <h2>注册</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="next" value="{{ next_path }}">
    <label>用户名
      <input type="text" name="username" required maxlength="50" autofocus>
    </label>
    <label>密码（至少 6 位）
      <input type="password" name="password" required minlength="6">
    </label>
    <button type="submit">注册并登录</button>
  </form>
  <p class="switch">
    已有账号？
    {% if next_path %}<a href="{{ url_for('auth.login', next=next_path) }}">去登录</a>
    {% else %}<a href="{{ url_for('auth.login') }}">去登录</a>{% endif %}
  </p>
</div>
{% endblock %}
