{% extends "base.html" %}
{% block title %}登录 · 招聘数据分析仪表盘{% endblock %}
{% block content %}
<div class="auth-box">
  <h2>登录</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="next" value="{{ next_path }}">
    <label>用户名
      <input type="text" name="username" required autofocus>
    </label>
    <label>密码
      <input type="password" name="password" required>
    </label>
    <label>验证码（5 分钟内有效）
      <input type="text" name="captcha" required maxlength="4" autocomplete="off">
    </label>
    <img class="captcha-img" src="{{ url_for('auth.captcha_image') }}" alt="验证码，点击刷新"
         title="看不清？点击刷新" onclick="this.src='{{ url_for('auth.captcha_image') }}?t=' + Date.now()">
    <label class="remember">
      <input type="checkbox" name="remember_me" value="1"> 记住我（7 天内免登录）
    </label>
    <button type="submit">登录</button>
  </form>
  <p class="switch">
    没有账号？
    {% if next_path %}<a href="{{ url_for('auth.register', next=next_path) }}">去注册</a>
    {% else %}<a href="{{ url_for('auth.register') }}">去注册</a>{% endif %}
  </p>
</div>
{% endblock %}
